[[language]]
name = "c"
auto-format = false
language-servers = ["clangd"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "cpp"
auto-format = false
language-servers = ["clangd"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "r"
language-servers = ["r-languageserver"]

[language-server.r-languageserver]
command = "R"
args = ["--no-echo", "-e", "languageserver::run()"]

[language-server.tinymist]
command = "tinymist"
config = { exportPdf = "onSave", outputPath = "$root/target/$name" }

[[language]]
name = "typst"
language-servers = ["tinymist"]

[[language]]
name = "python"
language-servers = ["pyright"]
# auto-format = true (se usar formatadores como o 'black')

[[language]]
name = "sql"
language-servers = ["sqls"]

[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]

[[language]]
name = "javascript"
language-servers = ["typescript-language-server"]
